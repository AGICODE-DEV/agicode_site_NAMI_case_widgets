body {
  font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif;
}
:root {
  --workspace-card-inset: 14px;
  --background: #f4f6f9;
  --foreground: #152538;
  --card: #fff;
  --card-foreground: #152538;
  --popover: #fff;
  --popover-foreground: #152538;
  --primary: #253b61;
  --primary-foreground: #fff;
  --secondary: #eaf0f8;
  --secondary-foreground: #223659;
  --muted: #eef1f6;
  --muted-foreground: #616e82;
  --accent: #eaf0f8;
  --accent-foreground: #223659;
  --destructive: #b72a3a;
  --border: #e0e6ef;
  --input: #d4dce7;
  --ring: #6a87bd;
  --chart-1: #253b61;
  --chart-2: #ed6742;
  --chart-3: #298b84;
  --chart-4: #a46dce;
  --chart-5: #dfad51;
  --radius: 0.65rem;
  --sidebar: #17283d;
  --sidebar-foreground: #fff;
  --sidebar-primary: #ed6742;
  --sidebar-primary-foreground: #fff;
  --sidebar-accent: #253b61;
  --sidebar-accent-foreground: #fff;
  --sidebar-border: #35435a;
  --sidebar-ring: #7189b0;
  --font-geist-sans: 'Segoe UI', Arial, sans-serif;
  --font-geist-mono: Consolas, monospace;
}
.dark {
  --background: #101b2b;
  --foreground: #edf2fb;
  --card: #17283d;
  --card-foreground: #edf2fb;
  --popover: #17283d;
  --popover-foreground: #edf2fb;
  --primary: #9db6e5;
  --primary-foreground: #101b2b;
  --secondary: #253b61;
  --secondary-foreground: #edf2fb;
  --muted: #24354c;
  --muted-foreground: #a7b5ca;
  --accent: #253b61;
  --accent-foreground: #edf2fb;
  --destructive: #ff8695;
  --border: #35465f;
  --input: #415470;
  --ring: #9db6e5;
}
@layer base {
  * {
    border-color: var(--border);
    outline-color: var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      outline-color: color-mix(in oklab, var(--ring) 50%, transparent);
    }
  }
  body {
    background-color: var(--background);
    color: var(--foreground);
  }
}
body {
  margin: 0;
  font-size: 1rem;
  line-height: 1.5;
}
.admin-scale-anchor {
  zoom: 90%;
}
button,
a,
input {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
a {
  text-decoration: none;
}
.topbar {
  min-height: 88px;
  background: #17283d;
  color: white;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 18px 5%;
}
.brand {
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 24px;
  margin-left: 8px;
}
.brand-wordmark {
  display: inline-flex;
  align-items: flex-end;
  gap: 0.035em;
  font: inherit;
  font-family: var(--font-thaipiece-logo), cursive;
  font-weight: 400;
  line-height: 1;
  letter-spacing: 1px;
  white-space: nowrap;
}
.brand-wordmark .brand-cap {
  font-size: 1em;
  line-height: 1;
}
.brand-wordmark .brand-lower {
  font-size: 0.76em;
  line-height: 1;
}
.brand:before {
  content: '';
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f05e39;
}
.brand-note {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 2px;
  padding-left: 24px;
  border-left: 1px solid #47536a;
}
.workspace-label {
  margin-left: auto;
  color: #b3c0d4;
  font-size: 14px;
}
.workspace-avatar {
  display: grid;
  place-items: center;
  flex: 0 0 38px;
  align-self: center;
  width: 38px;
  height: 38px;
  background: #2b3c54;
  border: 1px solid #51617c;
  border-radius: 50%;
  font-weight: 600;
  line-height: 1;
}
.main-content {
  max-width: 1540px;
  margin: 0 auto;
  padding: 44px 5% 70px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  margin-bottom: 30px;
}
.eyebrow {
  color: #6c798f;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.8px;
  margin: 0 0 10px;
}
h1 {
  font-size: clamp(1.9rem, 3vw, 2.4rem);
  line-height: 1.15;
  font-weight: 650;
  letter-spacing: -0.8px;
  margin: 0;
}
h2 {
  font-size: 1.15rem;
  font-weight: 600;
}
h3 {
  font-size: 1.1rem;
